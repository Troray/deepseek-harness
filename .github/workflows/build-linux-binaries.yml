name: Build Linux Binaries (x64 / arm64)

# 专为无桌面/无头环境（如 Linux 服务器、Armbian 开发板、树莓派等）编译的独立单文件可执行程序
# 内嵌 Node.js 24 运行时环境，无需在目标机器安装 Node.js 或 pnpm，解压即用。
# 支持 Web 浏览器界面服务模式（./dsh web）与 Headless 命令行任务模式（./dsh --profile headless）

on:
  workflow_dispatch:
    inputs:
      targets:
        description: '构建目标平台（逗号分隔；默认同时构建 x64 与 arm64）'
        type: string
        required: false
        default: 'node24-linux-x64,node24-linux-arm64'
      compress:
        description: '单文件 SEA 归档压缩算法（Brotli 体积最小；GZip 速度较快）'
        type: choice
        options: [Brotli, GZip, None]
        default: Brotli
        required: false
      publish_release:
        description: '构建完成后是否自动发布/更新到 GitHub Releases'
        type: boolean
        required: false
        default: true
      tag_name:
        description: 'Release Tag 标签（默认: linux-latest；亦可填版本号如 v0.2.2）'
        type: string
        required: false
        default: 'linux-latest'
      draft:
        description: '是否发布为草稿（Draft）'
        type: boolean
        required: false
        default: false
      prerelease:
        description: '是否标记为预发布（Prerelease）'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: build-linux-binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'
  DSH_BUILD_CLIENT_PROFILE: 'official'

jobs:
  plan:
    name: Plan targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Compute matrix from targets
        id: plan
        env:
          TARGETS: ${{ inputs.targets || 'node24-linux-x64,node24-linux-arm64' }}
        run: |
          set -euo pipefail
          matrix='[]'
          IFS=',' read -r -a targets <<< "$TARGETS"
          for raw in "${targets[@]}"; do
            t="$(echo "$raw" | xargs)"
            [ -z "$t" ] && continue
            case "$t" in
              node24-linux-x64)   runner=ubuntu-24.04; platform=linux-x64 ;;
              node24-linux-arm64) runner=ubuntu-24.04-arm; platform=linux-arm64 ;;
              *)
                echo "::error::Unsupported target '$t'. Supported: node24-linux-x64, node24-linux-arm64."
                exit 1
                ;;
            esac
            matrix="$(jq -c --arg target "$t" --arg runner "$runner" --arg platform "$platform" '. + [{target: $target, runner: $runner, platform: $platform}]' <<< "$matrix")"
          done
          if [ "$matrix" = '[]' ]; then
            echo "::error::No targets selected."
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.pkg-cache
          key: pkg-fetch-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pkg-fetch-${{ matrix.target }}-

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          exit 1

      - name: Install musl toolchain
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq musl-tools
          musl-gcc --version

      - name: Build complete native system binaries
        shell: bash
        run: |
          pnpm --filter @deepseek-ai/node-addon-system-workspace run build:native

      - name: Verify native binaries metadata
        shell: bash
        run: |
          node native/system/scripts/verify-launcher-binary.mjs packages/${{ matrix.platform }}

      - name: Build compatible Linux node-pty (glibc 2.28)
        shell: bash
        run: bash scripts/prepare-linux-node-pty.sh

      - name: Build single-exe binary
        run: >-
          pnpm exec tsx scripts/build-exe-for-python-sdk.ts
          --targets=${{ matrix.target }}
          --build-artifacts
          --compress=${{ inputs.compress || 'Brotli' }}

      - name: Package standalone archive
        shell: bash
        run: |
          set -euo pipefail
          pkg_dir="dsh-${{ matrix.platform }}"
          mkdir -p "$pkg_dir"

          # 复制主可执行文件及其 ripgrep 伴随文件
          cp "dist-exe/deepseek-harness-sdk-runtime-${{ matrix.platform }}" "$pkg_dir/"
          cp "dist-exe/deepseek-harness-sdk-runtime-${{ matrix.platform }}-rg" "$pkg_dir/"

          # 创建便捷软链接 dsh 和 dsh-rg，使用户可以直接使用 ./dsh 命令
          (cd "$pkg_dir" && ln -sf "deepseek-harness-sdk-runtime-${{ matrix.platform }}" dsh)
          (cd "$pkg_dir" && ln -sf "deepseek-harness-sdk-runtime-${{ matrix.platform }}-rg" dsh-rg)

          # 复制伴随资源目录
          if [ -d "dist-exe/${{ matrix.platform }}" ]; then
            cp -r "dist-exe/${{ matrix.platform }}" "$pkg_dir/"
          fi

          # 复制 PM2 示例配置文件
          cp ecosystem.config.example.js "$pkg_dir/"

          # 写入运行说明与快速上手文档
          cat <<'EOF' > "$pkg_dir/README.txt"
          ==================================================
          DeepSeek Harness (Standalone Linux Binary)
          ==================================================

          一、环境与解压说明：
          本二进制包基于 Node.js 24 Enhanced SEA 打包，内嵌完整运行时与 Web 前端，
          目标机器无需安装 Node.js、pnpm 或编译工具链，解压后即可直接运行。
          底层原生扩展兼容 glibc 2.28+（Debian 10+、Ubuntu 20.04+ 及主流 Armbian 发行版）。

          Linux 终端直接解压（系统自带 tar 命令）：
             tar -xzf dsh-linux-*.tar.gz
             cd dsh-linux-*

          二、配置与密钥（推荐）：
          可以在可执行文件同级目录创建或编辑 .env 文件：
             DEEPSEEK_API_KEY=sk-xxxxxxxxxxxxxxxxxxxxxxxx
             DSH_TOKEN=my_secret_token_123

          * 说明：DSH_TOKEN 用于 Web 界面访问登录鉴权，仅支持字母、数字、下划线和中划线。

          三、快速启动：

          1. Web 服务前台运行：
             # 请将 192.168.1.100 替换为机器实际局域网 IP（可用 hostname -I 查看）：
             ./dsh web --host 192.168.1.100 --port 3081 --token my_secret_token_123 --no-open
             # 也可以通过脚本自动提取本机第一个 IP 启动：
             # ./dsh web --host $(hostname -I | awk '{print $1}') --port 3081 --token my_secret_token_123 --no-open

             核心参数说明：
             --host <IP>      绑定机器具体网卡 IP（出于防 RCE 远程命令执行安全考虑，系统禁止使用 0.0.0.0 通配地址）
             --port 3081      指定 Web 服务端口
             --token <Token>  自定义 Web 登录鉴权 Token（也可在 .env 中设置 DSH_TOKEN）
             --no-open        无头/无桌面环境下禁止尝试打开本地图形浏览器

             浏览器访问：
             打开 http://192.168.1.100:3081/?token=my_secret_token_123 即可免密登录。

          2. 后台持久服务模式：

             【方式 A：推荐使用 PM2 管理（支持监控、异常重启与开机自启）】

             方法 1：使用 ecosystem.config.js 配置文件（最推荐，便于管理参数与 API Key）
             包内已附带示例配置文件 ecosystem.config.example.js：
                cp ecosystem.config.example.js ecosystem.config.js
                # 编辑 ecosystem.config.js，按需修改 IP、端口、Token 与 API Key
                # 启动服务：
                pm2 start ecosystem.config.js

             方法 2：直接使用命令行参数启动：
                pm2 start ./dsh --name dsh --interpreter none -- web --host $(hostname -I | awk '{print $1}') --port 3081 --token my_secret_token_123 --no-open

             常用 PM2 运维命令：
                pm2 logs dsh          # 查看实时输出日志
                pm2 restart dsh       # 重启服务（若修改了配置文件需执行 pm2 restart ecosystem.config.js）
                pm2 stop dsh          # 停止服务
                pm2 save              # 保存当前运行列表（下次开机自动恢复）
                pm2 startup           # 配置服务器开机自启动脚本

             【方式 B：使用 nohup 简易后台运行】
             nohup ./dsh web --host $(hostname -I | awk '{print $1}') --port 3081 --token my_secret_token_123 --no-open > dsh.log 2>&1 &

          3. 命令行单次任务模式（Headless CLI）：
             export DEEPSEEK_API_KEY="sk-你的密钥"
             ./dsh --profile headless "请帮我分析当前目录下的代码结构"
          EOF

          tar -czvf "dsh-${{ matrix.platform }}.tar.gz" "$pkg_dir"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-${{ matrix.platform }}
          path: dsh-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    name: Publish to GitHub Releases
    if: inputs.publish_release != false || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: dsh-*
          path: dist-release
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist-release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dsh-*.tar.gz > SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
          IS_DRAFT: ${{ inputs.draft && '--draft' || '' }}
          IS_PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="linux-latest"
          fi

          TITLE="DeepSeek Harness Linux Binaries ($TAG)"

          sed 's/^          //' <<EOF > release_notes.md
          ### DeepSeek Harness Standalone Linux Binaries ($TAG)

          专为 Linux 服务器与 ARM 开发板（Armbian、树莓派）打包的独立单文件免安装运行程序。
          - **构建分支/Tag**：\`${REF_NAME}\` (\`${COMMIT_SHA}\`)
          - **构建时间**：$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          #### 📦 下载文件：
          - \`dsh-linux-x64.tar.gz\`：适用 64 位 x86 架构（Linux PC / 云服务器）
          - \`dsh-linux-arm64.tar.gz\`：适用 64 位 ARM 架构（香橙派、树莓派、各型号 Armbian 电视盒子）
          - \`SHA256SUMS\`：各归档包的 SHA256 校验和

          #### 🚀 快速使用：
          \`\`\`bash
          # 1. 解压进入目录（系统自带 tar 命令）
          tar -xzf dsh-linux-*.tar.gz
          cd dsh-linux-*

          # 2. 方式 A：推荐使用 PM2 启动后台持久服务（包内已含 ecosystem.config.example.js 模板）
          cp ecosystem.config.example.js ecosystem.config.js
          # 填入你的 DEEPSEEK_API_KEY 与访问 Token 后启动：
          pm2 start ecosystem.config.js

          # 2. 方式 B：前台直接启动 Web 服务（支持局域网浏览器访问）
          ./dsh web --host \$(hostname -I | awk '{print \$1}') --port 3081 --token 自定义Token --no-open
          \`\`\`
          EOF

          # 检查 Release 是否已存在
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists. Updating release notes and uploading assets..."
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md $IS_DRAFT $IS_PRERELEASE || true
            gh release upload "$TAG" dist-release/dsh-*.tar.gz dist-release/SHA256SUMS --clobber
          else
            echo "Creating new release '$TAG'..."
            gh release create "$TAG" dist-release/dsh-*.tar.gz dist-release/SHA256SUMS \
              --target "$COMMIT_SHA" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              $IS_DRAFT $IS_PRERELEASE
          fi
          echo "Successfully published release: $(gh release view "$TAG" --json url -q .url)"

